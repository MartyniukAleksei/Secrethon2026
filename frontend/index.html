    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Найм у ВПК РФ: підприємства, вакансії, санкції та географія найму за відкритими даними — одна картка на підприємство, фокус на БпЛА, ракети й КАБ." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint (see src/hooks/useTheme.ts).
      try {
        const saved = localStorage.getItem('ds-theme')
        if (saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
